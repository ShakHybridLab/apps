# Fabrique la carte des limitations de vitesse de ShakLimites (bimmer/apps/shaklimites/limits/) à partir d'OpenStreetMap.
# À lancer à la main (onglet Actions, « Carte des limitations », Run workflow) ou en modifiant le fabricant ; une fois par mois sinon.
# Le résultat (les carreaux et un journal) est commité sur la branche : la voiture le reçoit à la prochaine mise à jour de ShakLimites.
name: Carte des limitations
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 2 * *'
  push:
    branches: [main]
    paths:
      - 'bimmer/tools/build_limits.py'
      - 'bimmer/tools/make_radar_zones.py'
      - '.github/workflows/limites.yml'
permissions:
  contents: write
concurrency:
  group: limites
  cancel-in-progress: false
jobs:
  carte:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # la pointe de la branche au moment où la fabrication démarre, pas le commit qui l'a demandée : sinon le résultat
          # d'une fabrication passée entre-temps entre en conflit avec celui-ci à l'envoi (échec de la n° 6, 19 nov. 2026)
          ref: ${{ github.ref_name }}
      - name: Outils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Fabrication
        run: |
          set -o pipefail
          LOG=bimmer/data/limites_fabrication.txt
          mkdir -p bimmer/apps/shaklimites/limits
          {
            echo "Fabrication du $(date -u +%Y-%m-%dT%H:%MZ)"
            wget -nv -O /tmp/france.osm.pbf https://download.geofabrik.de/europe/france-latest.osm.pbf
            ls -la /tmp/france.osm.pbf
            osmium tags-filter /tmp/france.osm.pbf w/highway=motorway,motorway_link,trunk,trunk_link,primary,primary_link,secondary,secondary_link -o /tmp/routes.osm.pbf --overwrite
            ls -la /tmp/routes.osm.pbf
            osmium export /tmp/routes.osm.pbf -f geojsonseq --geometry-types=linestring -o /tmp/routes.geojsonseq --overwrite
            ls -la /tmp/routes.geojsonseq
            # l'Île-de-France en détail (demande du propriétaire) : aussi les petites routes et les rues qui portent une limitation
            osmium extract -b 1.44,48.10,3.56,49.25 /tmp/france.osm.pbf -o /tmp/idf.osm.pbf --overwrite
            osmium tags-filter /tmp/idf.osm.pbf w/highway=tertiary,tertiary_link,unclassified,residential,living_street -o /tmp/rues.osm.pbf --overwrite
            osmium export /tmp/rues.osm.pbf -f geojsonseq --geometry-types=linestring -o /tmp/rues.geojsonseq --overwrite
            ls -la /tmp/rues.geojsonseq
            python3 bimmer/tools/build_limits.py /tmp/routes.geojsonseq /tmp/rues.geojsonseq bimmer/apps/shaklimites/limits
            du -sh bimmer/apps/shaklimites/limits
            ls bimmer/apps/shaklimites/limits | wc -l
            # les zones de danger de l'alerte (liste officielle des radars fixes, data.gouv.fr) : zones courtes en ville, direction de la route
            osmium tags-filter /tmp/france.osm.pbf n/highway=speed_camera -o /tmp/radars_osm.osm.pbf --overwrite
            osmium export /tmp/radars_osm.osm.pbf -f geojsonseq --geometry-types=point -o /tmp/radars_osm.geojsonseq --overwrite
            wc -l /tmp/radars_osm.geojsonseq
            # ce que les contributeurs d'OpenStreetMap ont noté du sens contrôlé par chaque radar (relations « enforcement »)
            osmium tags-filter /tmp/france.osm.pbf r/type=enforcement -o /tmp/enf.osm.pbf --overwrite
            osmium cat /tmp/enf.osm.pbf -f opl -o /tmp/enf.opl --overwrite
            grep -c '^r' /tmp/enf.opl || true
            python3 bimmer/tools/make_radar_zones.py auto /tmp/routes.geojsonseq /tmp/rues.geojsonseq --osm /tmp/radars_osm.geojsonseq --enf /tmp/enf.opl --out bimmer/data/radars_fr_zones.json --out bimmer/apps/shaktheme/zones/radars_fr_zones.json --out bimmer/apps/shakradar/zones/radars_fr_zones.json || echo "ECHEC des zones de danger (l'ancienne liste reste)"
          } 2>&1 | tee "$LOG.new" || echo "ECHEC (voir ci-dessus)" >> "$LOG.new"
          mv "$LOG.new" "$LOG"
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A bimmer/apps/shaklimites/limits bimmer/data/limites_fabrication.txt bimmer/data/radars_fr_zones.json bimmer/apps/shaktheme/zones bimmer/apps/shakradar/zones
          if git diff --cached --quiet; then echo "rien de nouveau"; exit 0; fi
          if git diff --cached --quiet -- bimmer/apps/shaklimites/limits bimmer/apps/shaktheme/zones; then
            # la carte n'a pas changé (ou la fabrication a échoué) : seul le journal part
            git commit -q -m "ShakLimites : journal de fabrication de la carte"
            git pull -q --rebase origin "${GITHUB_REF_NAME}"
            git push -q origin "HEAD:${GITHUB_REF_NAME}"
            exit 0
          fi
          # la carte a changé : la version de l'appli monte d'un cran, pour que la voiture propose la mise à jour
          python3 - <<'PY'
          import re, subprocess
          def changed(path):
              return subprocess.call(['git', 'diff', '--cached', '--quiet', '--', path]) != 0
          def bump(app):
              p = 'bimmer/apps/%s/app.json' % app
              s = open(p, encoding='utf-8').read()
              m = re.search(r'"version": "(\d+)\.(\d+)\.(\d+)"', s)
              s = s[:m.start()] + '"version": "%s.%s.%d"' % (m.group(1), m.group(2), int(m.group(3)) + 1) + s[m.end():]
              open(p, 'w', encoding='utf-8').write(s)
          if changed('bimmer/apps/shaklimites/limits'):
              bump('shaklimites')
          if changed('bimmer/apps/shaktheme/zones'):
              bump('shaktheme'); bump('shakradar')
          PY
          git add bimmer/apps/shaklimites/app.json bimmer/apps/shaktheme/app.json bimmer/apps/shakradar/app.json
          git commit -q -m "Carte des limitations et zones de danger refaites (OpenStreetMap, data.gouv.fr)"
          git pull -q --rebase origin "${GITHUB_REF_NAME}"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
