# Fabrique la carte des limitations de vitesse de ShakLimites (bimmer/apps/shaklimites/limits/) à partir d'OpenStreetMap.
# À lancer à la main (onglet Actions, « Carte des limitations », Run workflow) ou en modifiant le fabricant ; une fois par mois sinon.
# Le résultat (les carreaux et un journal) est commité sur la branche : la voiture le reçoit à la prochaine mise à jour de ShakLimites.
name: Carte des limitations
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 2 * *'
  push:
    branches: [main]
    paths:
      - 'bimmer/tools/build_limits.py'
      - '.github/workflows/limites.yml'
permissions:
  contents: write
concurrency:
  group: limites
  cancel-in-progress: false
jobs:
  carte:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Outils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Fabrication
        run: |
          set -o pipefail
          LOG=bimmer/data/limites_fabrication.txt
          mkdir -p bimmer/apps/shaklimites/limits
          {
            echo "Fabrication du $(date -u +%Y-%m-%dT%H:%MZ)"
            wget -nv -O /tmp/france.osm.pbf https://download.geofabrik.de/europe/france-latest.osm.pbf
            ls -la /tmp/france.osm.pbf
            osmium tags-filter /tmp/france.osm.pbf w/highway=motorway,motorway_link,trunk,trunk_link,primary,primary_link,secondary,secondary_link -o /tmp/routes.osm.pbf --overwrite
            ls -la /tmp/routes.osm.pbf
            osmium export /tmp/routes.osm.pbf -f geojsonseq --geometry-types=linestring -o /tmp/routes.geojsonseq --overwrite
            ls -la /tmp/routes.geojsonseq
            python3 bimmer/tools/build_limits.py /tmp/routes.geojsonseq bimmer/apps/shaklimites/limits
            du -sh bimmer/apps/shaklimites/limits
            ls bimmer/apps/shaklimites/limits | wc -l
          } 2>&1 | tee "$LOG.new" || echo "ECHEC (voir ci-dessus)" >> "$LOG.new"
          mv "$LOG.new" "$LOG"
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A bimmer/apps/shaklimites/limits bimmer/data/limites_fabrication.txt
          if git diff --cached --quiet; then echo "rien de nouveau"; exit 0; fi
          git commit -q -m "ShakLimites : carte des limitations refaite depuis OpenStreetMap"
          git pull -q --rebase origin "${GITHUB_REF_NAME}"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
